# Not bundled — fetch on demand with:
#   pbl standards sync --jurisdiction "<name>"
#
# The upstream Knowledge Graph carries these state frameworks. They are not in
# git because together they are far larger than the multi-state slice and most
# users need exactly one. The sync command caches into .cache/standards/.
