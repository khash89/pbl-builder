# Non-US and other frameworks
other_frameworks:
  note: >
    The Knowledge Graph is US-focused. For any other framework — England's
    National Curriculum, the IB, Australian Curriculum, a national curriculum —
    set `jurisdiction` in the learner profile to a free-text label and enter
    standards manually with `code` set to the real code from your own framework
    documents. `pbl profile check` skips code resolution for jurisdictions it
    doesn't have locally, so this works without warnings.

    Never let an agent invent codes for a framework we don't ship. Use `TBD` and
    look them up yourself.

# Record shape — see ../../schema/README.md for the full description
record_fields:
  code: The official statement code. What you cite.
  framework: Framework id, e.g. NGSS, CCSS.MATH, C3, WIDA.
  jurisdiction: Multi-State, or a state name.
  subject: One of Mathematics, English Language Arts, Science, Social Studies.
  grades: Array of grade labels this applies to.
  text: The standard's text, whitespace-normalised.
  type: Always "Standard" in the bundled slice — containers are filtered out.
  language: BCP-47 tag. Mostly en-US; the WIDA-DALE set is es-US.
  license: CC BY 4.0 URL. Required for redistribution — do not strip.
  attribution: Full upstream attribution chain. Required for redistribution — do not strip.
  source_id: Upstream CASE identifier, for tracing back to the Knowledge Graph.
