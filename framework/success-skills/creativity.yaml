# Creativity
#
# Skill identified by PBLWorks as one of five success skills. The dimension
# structure and ALL performance-level descriptors below are original writing by
# PBL Builder contributors — not PBLWorks rubric language. For the official
# rubric, see pblworks.org/resources. See NOTICE.md.

version: 1
id: creativity
name: Creativity & Innovation
doc: ../../docs/08-success-skills.md#creativity
rubric: ../../rubrics/success-skills/creativity.md

definition: >
  Producing something that is both novel and useful — new relative to what the
  learner had seen, and genuinely fit for the purpose it was made for.

research_note: >
  The definition used widely in the field (Plucker, Beghetto & Dow) requires
  both novelty AND usefulness, judged within a social context. This matters
  practically: unusual-but-useless is not creativity, and neither is
  well-executed-but-derivative. Both halves are assessed.

why_it_needs_a_project: >
  Creativity requires a problem with more than one good solution and permission
  to fail at some of them. A task with a known correct answer cannot assess it,
  no matter how much colour is involved.

misconception_warning: >
  Creativity is not artistic talent, and it is not decoration. A learner can
  score highly on this rubric with a spreadsheet, a survey design, or a
  mechanism, and score poorly with a beautiful drawing that copies its model.
  If your assessment reduces to "how pretty is it," you are assessing something
  else.

levels: [beginning, emerging, developing, demonstrating]

dimensions:
  - id: idea-generation
    name: Generating & Exploring Ideas
    question: Do they produce real options before committing?
    levels:
      beginning: >
        Produces one idea and starts building it. Ideas that do appear may not
        connect to the actual problem.
      emerging: >
        Generates a few ideas, mostly variations on the first one or on an
        example they've seen.
      developing: >
        Generates a genuine range of ideas connected to the objectives, and
        holds off committing until several are on the table.
      demonstrating: >
        Generates ideas from more than one angle, combines and adapts them into
        options that didn't exist at the start, and can explain why they set
        aside the ones they set aside.
    teach_by:
      - Require five options before any building begins
      - "What would this look like if it were the opposite?"
      - Look at how a different field solves the same structural problem
    look_for: >
      A later idea that clearly descends from combining two earlier ones. That's
      the mechanism working.

  - id: novelty-and-usefulness
    name: Novelty & Usefulness of the Product
    question: Is it both new and fit for purpose?
    levels:
      beginning: >
        Closely follows an example or the conventional approach. Works, but
        contains no decision that couldn't be predicted.
      emerging: >
        Recognisably conventional with some original elements, usually
        surface-level. Or original but doesn't quite do the job.
      developing: >
        Contains genuinely original choices that serve the purpose. Someone
        familiar with the conventional approach would notice the difference.
      demonstrating: >
        Both novel and useful — an approach the learner arrived at themselves
        that solves the problem better than the obvious approach would, and
        demonstrably works.
    teach_by:
      - Show the conventional solution and ask what it gets wrong
      - Add a constraint that makes the obvious approach impossible
      - Test the product with real users and revise on what breaks
    look_for: >
      Usefulness verified by contact with reality, not asserted. Did they test
      it on anyone?
    note: >
      Novelty is judged relative to this learner's experience, not to world
      history. A nine-year-old reinventing a known technique independently is
      demonstrating creativity.

  - id: explaining-choices
    name: Explaining Creative Choices
    question: Can they account for what they did?
    levels:
      beginning: >
        Can't say why. "I just liked it," or attributes the choice to how it
        turned out.
      emerging: >
        Gives a reason, usually about preference rather than purpose.
      developing: >
        Explains choices in terms of what the product needs to do and who it's
        for.
      demonstrating: >
        Articulates the reasoning behind decisions, including the trade-offs
        accepted and the alternatives rejected, in terms of purpose and
        audience.
    teach_by:
      - '"Why this and not the other one?" on every significant decision'
      - Keep a running decision log with reasons written at the time
      - Have them defend a choice to someone who prefers the alternative
    look_for: >
      Naming a trade-off — "I lost some accuracy but a ten-year-old can
      actually read it." That's design thinking.

  - id: risk-and-iteration
    name: Risk-Taking & Iteration
    question: Do they try things that might not work?
    levels:
      beginning: >
        Avoids anything uncertain. Sticks to what's guaranteed to be adequate.
      emerging: >
        Will try something new when encouraged and supported. Abandons it
        quickly if the first attempt fails.
      developing: >
        Chooses to try uncertain approaches. Iterates when they fail rather than
        reverting to the safe option.
      demonstrating: >
        Deliberately pursues the ambitious version, treats failed attempts as
        information, and can point to how a specific failure improved the final
        product.
    teach_by:
      - Make one required attempt explicitly non-assessed
      - Ask what the ambitious version would be, then ask what it would take
      - Require the final product to document one thing that didn't work
    look_for: >
      Voluntarily discarding something that already worked in order to try
      something better. Rare and worth naming out loud when it happens.

project_design_notes:
  needs_from_project:
    - A problem with several genuinely viable solutions
    - Time and permission for at least one attempt to fail
    - Assessment criteria about fitness for purpose, not polish
    - Real users or an audience to test usefulness against
  pairs_well_with_products: [physical-model, picture-book-or-zine, public-service-announcement, event, interactive-map-or-tour, documentary-or-video]
  weak_pairing_warning: >
    If the product has a template or a single conventional form, creativity has
    nowhere to live. Also: don't target creativity in a compressed timeline —
    without room to iterate, you'll be assessing the first idea, which is
    exactly what this rubric penalises.
